<text x="350" y="110" fill="#8B7A8B" font-size="12.0" text-anchor="middle" font-family="'VT323',monospace">RULE STATE</text>
<path d="M55,140 L620,140" fill="none" stroke="#8B7A8B" stroke-width="1.8"/>
<circle cx="120" cy="140" r="5" fill="#4A9B9B"/>
