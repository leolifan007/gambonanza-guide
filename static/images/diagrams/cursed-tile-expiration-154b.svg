<text x="515.0" y="396" fill="#E8D5C0" font-size="12.5" text-anchor="middle">time the safe route</text>
<text x="350" y="422" fill="#8B7A8B" font-size="12.0" text-anchor="middle">Boss facts from shipped game; fixes from 1.5.4b and 1.5.6</text>
