<marker id="aRose" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#A85D6A"/></marker>
</defs>
<text x="350" y="33" fill="#D4A84A" font-size="22.0" text-anchor="middle" font-family="'VT323',monospace">Cursed Tile Expiration - Two Fixes, One Read</text>
<text x="350" y="53" fill="#8B7A8B" font-size="12.0" text-anchor="middle">1.5.4b fixed the visual update, 1.5.6 fixed early vanishing</text>
