<text x="350" y="192" fill="#A85D6A" font-size="12.0" text-anchor="middle">mismatch: the board lied about the rule</text>
<text x="350" y="234" fill="#D4A84A" font-size="15.0" text-anchor="middle" font-family="'VT323',monospace">AFTER THE FIXES</text>
<path d="M55,270 L620,270" fill="none" stroke="#D4A84A" stroke-width="1.8" marker-end="url(#aGold)"/>
