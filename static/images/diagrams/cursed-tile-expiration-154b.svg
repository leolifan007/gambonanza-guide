<text x="185.0" y="396" fill="#E8D5C0" font-size="12.5" text-anchor="middle">step -&gt; demote to pawn</text>
<rect x="390" y="330" width="250" height="70" rx="8" fill="#2D1A2D" stroke="#D4A84A" stroke-width="1.5"/>
