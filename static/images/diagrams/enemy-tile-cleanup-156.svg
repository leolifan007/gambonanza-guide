<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif" width="700" height="440" viewBox="0 0 700 440">
<rect width="700" height="440" fill="#1A0F1A" rx="12"/>
<defs>
<marker id="aGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#D4A84A"/></marker>
<marker id="aTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#4A9B9B"/></marker>
<marker id="aRose" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#A85D6A"/></marker>
</defs>
<text x="350" y="33" fill="#D4A84A" font-size="22.0" text-anchor="middle" font-family="'VT323',monospace">1.5.6 - Four Fixes, Three Impact Areas</text>
<text x="350" y="53" fill="#8B7A8B" font-size="12.0" text-anchor="middle">Grouped by where the fix actually shows up</text>
<rect x="275" y="66" width="150" height="38" rx="8" fill="#2D1A2D" stroke="#D4A84A" stroke-width="1.5"/>
<text x="350.0" y="89.0" fill="#F5E6D3" font-size="14.0" text-anchor="middle">1.5.6 PATCH</text>
<path d="M320,104 L150,116" fill="none" stroke="#4A9B9B" stroke-width="1.8" marker-end="url(#aTeal)"/>
<path d="M350,104 L350,116" fill="none" stroke="#4A9B9B" stroke-width="1.8" marker-end="url(#aTeal)"/>
<path d="M380,104 L550,116" fill="none" stroke="#4A9B9B" stroke-width="1.8" marker-end="url(#aTeal)"/>
<rect x="25" y="120" width="250" height="28" rx="8" fill="#2D1A2D" stroke="#D4A84A" stroke-width="1.5"/>
<text x="150.0" y="138.0" fill="#F5E6D3" font-size="13.0" text-anchor="middle">BOARD STATE</text>
<rect x="290" y="120" width="170" height="28" rx="8" fill="#2D1A2D" stroke="#4A9B9B" stroke-width="1.5"/>
<text x="375.0" y="138.0" fill="#F5E6D3" font-size="12.0" text-anchor="middle">MENU / PLATFORM</text>
<rect x="475" y="120" width="200" height="28" rx="8" fill="#2D1A2D" stroke="#A85D6A" stroke-width="1.5"/>
<text x="575.0" y="138.0" fill="#F5E6D3" font-size="13.0" text-anchor="middle">STRAIN POOL</text>
<rect x="25" y="158" width="250" height="178" rx="8" fill="#2D1A2D" stroke="#D4A84A" stroke-width="1.5"/>
<rect x="25" y="158" width="250" height="24" rx="8" fill="#D4A84A" opacity="0.18"/>
<text x="150.0" y="175" fill="#D4A84A" font-size="15.0" text-anchor="middle" font-family="'VT323',monospace">TWO BOARD FIXES</text>
<text x="150.0" y="204" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Enemies clear their</text>
<text x="150.0" y="230" fill="#E8D5C0" font-size="12.5" text-anchor="middle">old tile reliably</text>
<text x="150.0" y="256" fill="#E8D5C0" font-size="12.5" text-anchor="middle">No error when a cursed</text>
<text x="150.0" y="282" fill="#E8D5C0" font-size="12.5" text-anchor="middle">tile piece disappears</text>
<rect x="290" y="158" width="170" height="178" rx="8" fill="#2D1A2D" stroke="#4A9B9B" stroke-width="1.5"/>
<rect x="290" y="158" width="170" height="24" rx="8" fill="#4A9B9B" opacity="0.18"/>
<text x="375.0" y="175" fill="#4A9B9B" font-size="15.0" text-anchor="middle" font-family="'VT323',monospace">ONE MENU FIX</text>
<text x="375.0" y="204" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Esc spam after</text>
<text x="375.0" y="230" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Pause &gt; Main Menu</text>
<text x="375.0" y="256" fill="#E8D5C0" font-size="12.5" text-anchor="middle">no longer breaks</text>
<text x="375.0" y="282" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Platform only</text>
<rect x="475" y="158" width="200" height="178" rx="8" fill="#2D1A2D" stroke="#A85D6A" stroke-width="1.5"/>
<rect x="475" y="158" width="200" height="24" rx="8" fill="#A85D6A" opacity="0.18"/>
<text x="575.0" y="175" fill="#A85D6A" font-size="15.0" text-anchor="middle" font-family="'VT323',monospace">ONE POOL FIX</text>
<text x="575.0" y="204" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Magic Tiles Strain</text>
<text x="575.0" y="230" fill="#E8D5C0" font-size="12.5" text-anchor="middle">adds phantom tiles</text>
<text x="575.0" y="256" fill="#E8D5C0" font-size="12.5" text-anchor="middle">to the start pool</text>
<text x="575.0" y="282" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Run creation only</text>
<rect x="25" y="350" width="650" height="52" rx="8" fill="#2D1A2D" stroke="#4A9B9B" stroke-width="1.5"/>
<text x="350" y="372" fill="#F5E6D3" font-size="12.0" text-anchor="middle">The stale-square fix is the one that changes a turn decision.</text>
<text x="350" y="391" fill="#8B7A8B" font-size="12.0" text-anchor="middle">The other three are stability or run-creation fixes.</text>
<text x="350" y="422" fill="#8B7A8B" font-size="12.0" text-anchor="middle">Grouped from the official 1.5.6 post</text>
</svg>
