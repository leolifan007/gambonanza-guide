<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif" width="700" height="440" viewBox="0 0 700 440">
<rect width="700" height="440" fill="#1A0F1A" rx="12"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#D4A84A"/></marker></defs>
<text x="350" y="34" fill="#D4A84A" font-family="'VT323',monospace" font-size="22" text-anchor="middle">Stasis and the Crumble Counter</text>
<rect x="60" y="80" width="260" height="150" rx="8" fill="#2D1A2D" stroke="#C75B5B" stroke-width="1.5"/>
<rect x="60" y="80" width="260" height="24" rx="8" fill="#C75B5B" opacity="0.18"/>
<text x="190" y="97" fill="#C75B5B" font-family="'VT323',monospace" font-size="15" text-anchor="middle">Before 1.4.0</text>
<text x="190" y="120" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Wait on a Stasis enemy</text>
<text x="190" y="138" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Crumble counter</text>
<text x="190" y="156" fill="#E8D5C0" font-size="12.5" text-anchor="middle">still goes up</text>
<text x="190" y="174" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Board collapse risk</text>
<rect x="380" y="80" width="260" height="150" rx="8" fill="#2D1A2D" stroke="#6BBF6B" stroke-width="1.5"/>
<rect x="380" y="80" width="260" height="24" rx="8" fill="#6BBF6B" opacity="0.18"/>
<text x="510" y="97" fill="#6BBF6B" font-family="'VT323',monospace" font-size="15" text-anchor="middle">From 1.4.0</text>
<text x="510" y="120" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Wait on a Stasis enemy</text>
<text x="510" y="138" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Crumble counter</text>
<text x="510" y="156" fill="#E8D5C0" font-size="12.5" text-anchor="middle">does NOT advance</text>
<text x="510" y="174" fill="#E8D5C0" font-size="12.5" text-anchor="middle">Safer to sit and set up</text>
<text x="350" y="270" fill="#D4A84A" font-family="'VT323',monospace" font-size="20" text-anchor="middle">Stasis no longer feeds the counter</text>
</svg>
