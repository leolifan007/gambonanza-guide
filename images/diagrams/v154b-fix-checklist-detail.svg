<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif" width="700" height="260" viewBox="0 0 700 260">
<rect width="700" height="260" fill="#1A0F1A" rx="12"/>
<defs>
<marker id="aGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#D4A84A"/></marker>
<marker id="aTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#4A9B9B"/></marker>
<marker id="aRose" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#A85D6A"/></marker>
</defs>
<text x="350" y="33" fill="#D4A84A" font-size="22.0" text-anchor="middle" font-family="'VT323',monospace">Five-Minute Verification Pass</text>
<text x="350" y="53" fill="#8B7A8B" font-size="12.0" text-anchor="middle">Four client checks, in the order that costs the least</text>
<circle cx="97" cy="112" r="20" fill="none" stroke="#D4A84A" stroke-width="1.6"/>
<text x="97" y="118" fill="#D4A84A" font-size="17.0" text-anchor="middle" font-family="'VT323',monospace">1</text>
<text x="97" y="158" fill="#F5E6D3" font-size="13.0" text-anchor="middle" font-family="'VT323',monospace">SHOP PRICE</text>
<text x="97" y="180" fill="#E8D5C0" font-size="12.0" text-anchor="middle">Valhalla shows $8</text>
<path d="M123,112 L189,112" fill="none" stroke="#4A9B9B" stroke-width="1.8" marker-end="url(#aGold)"/>
<circle cx="267" cy="112" r="20" fill="none" stroke="#D4A84A" stroke-width="1.6"/>
<text x="267" y="118" fill="#D4A84A" font-size="17.0" text-anchor="middle" font-family="'VT323',monospace">2</text>
<text x="267" y="158" fill="#F5E6D3" font-size="13.0" text-anchor="middle" font-family="'VT323',monospace">SELL</text>
<text x="267" y="180" fill="#E8D5C0" font-size="12.0" text-anchor="middle">money moves</text>
<path d="M293,112 L359,112" fill="none" stroke="#4A9B9B" stroke-width="1.8" marker-end="url(#aGold)"/>
<circle cx="437" cy="112" r="20" fill="none" stroke="#D4A84A" stroke-width="1.6"/>
<text x="437" y="118" fill="#D4A84A" font-size="17.0" text-anchor="middle" font-family="'VT323',monospace">3</text>
<text x="437" y="158" fill="#F5E6D3" font-size="13.0" text-anchor="middle" font-family="'VT323',monospace">RESTART</text>
<text x="437" y="180" fill="#E8D5C0" font-size="12.0" text-anchor="middle">medal kept</text>
<path d="M463,112 L529,112" fill="none" stroke="#4A9B9B" stroke-width="1.8" marker-end="url(#aGold)"/>
<circle cx="607" cy="112" r="20" fill="none" stroke="#D4A84A" stroke-width="1.6"/>
<text x="607" y="118" fill="#D4A84A" font-size="17.0" text-anchor="middle" font-family="'VT323',monospace">4</text>
<text x="607" y="158" fill="#F5E6D3" font-size="13.0" text-anchor="middle" font-family="'VT323',monospace">CURSE</text>
<text x="607" y="180" fill="#E8D5C0" font-size="12.0" text-anchor="middle">square clears</text>
<text x="350" y="216" fill="#4A9B9B" font-size="12.0" text-anchor="middle">If any check fails, update the client before changing strategy.</text>
<text x="350" y="242" fill="#8B7A8B" font-size="12.0" text-anchor="middle">Checks derived from the official 1.5.4b fix list</text>
</svg>
